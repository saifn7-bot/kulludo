name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Test game rules
        run: npm test

      - name: Create Android project
        run: node scripts/prepare-native.mjs android

      - name: Build debug APK (install directly on any Android phone)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: KulLUDO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Play Store build (runs only after you add the 4 secrets, see README) ----
      - name: Build signed Play Store bundle (.aab)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 --decode > release.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - uses: actions/upload-artifact@v5
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: KulLUDO-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
